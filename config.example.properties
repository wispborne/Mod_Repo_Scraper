# Example settings for the Mod Repo Scraper.
#
# Copy this file to `config.properties` next to it and fill in your own tokens.
# That copy is ignored by git on purpose — it holds real secrets, so never
# commit it. Keep this example in step whenever a setting is added or renamed.
#
# How the file is read:
#   - one `key = value` per line; blank lines and lines starting with `#` are
#     skipped
#   - every key is optional. Leave one out and the built-in default applies
#   - a key that isn't recognised is warned about at startup and then ignored,
#     so a typo or an old name shows up instead of quietly doing nothing
#   - `true` / `false` for the yes-or-no settings; anything else counts as false
#
# The values here are a sensible starting point drawn from a working setup, not
# a dump of the built-in defaults. Where the two differ, the comment says what
# the built-in default is. The only things you must fill in yourself are the
# tokens, which are blank throughout.


# =========================
# General
# =========================

# How much detail goes in the log: VERBOSE, DEBUG, INFO, WARNING, ERROR.
# DEBUG is worth it while you are finding your feet.
log_level = INFO


# =========================
# ModRepo pipeline
# =========================
# Scrapes the forum, Discord and Nexus, then merges what it finds into one
# `outputs/ModRepo.json`.

# The whole pipeline. This is the one switch that is on unless you turn it off.
modrepo_enabled = true

# The three sources, each with its own switch. Only the forum works out of the
# box; the other two need a token, so they start off.
modrepo_forums_enabled = true
modrepo_discord_enabled = false
modrepo_nexus_enabled = false

# Your Discord user token. Needed only when `modrepo_discord_enabled` is true.
modrepo_discord_auth_token =

# The Unofficial Starsector Chat server, and the forum channels worth reading
# with the game version each one covers. These are the real ids this project
# targets, so you can leave them as they are.
modrepo_discord_server_id = 187635036525166592
modrepo_discord_forum_channels = 1203051351307985046:0.97a,1354895288422236362:0.98a

# Your Nexus Mods API token. Needed only when `modrepo_nexus_enabled` is true.
modrepo_nexus_api_token =

# Replay saved network responses instead of fetching. Handy while working on the
# merging code: fast, free, and the same answers every time. It only works once
# a real run has recorded the responses.
modrepo_use_cached = false

# Fetch less on each run, for a quicker, shallower pass while developing.
modrepo_less_scraping = false

# Keep every game version a single source lists for a mod, rather than only the
# newest.
modrepo_keep_all_game_versions = false

# Write `merge-debug.json`, which the results viewer's Merge view reads to show
# why each group of mods was merged. Cheap, and the view is the easiest way to
# see whether merging did the right thing. (Built-in default: false.)
modrepo_merge_debug = true

# How many past merges to keep, so the Merge view can show an older merge next
# to the newest and say what changed. Each one is kept squashed down and costs
# roughly a megabyte. Older ones are dropped; 0 keeps the lot. (Built-in
# default: 20.)
modrepo_merges_to_keep = 20


# =========================
# QB pipeline
# =========================
# Walks the forum boards topic by topic and saves a detailed record of each one,
# which becomes `outputs/forum-data-bundle.json`.

# The whole pipeline. (Built-in default: false.)
qb_enabled = true

# Where the scraped topics, the caches, the run history and the lock file live.
qb_data_path = qb_data

# Which topics a run should walk:
#   new_data       only topics that are new or whose last post changed
#   all            every topic on the chosen boards (a full refresh)
#   pages          the first N pages of each board (see the page limits below)
#   topics         a named list of topics
#   libraries_only just the libraries board, ignoring `qb_boards`
# The camelCase spellings (`newData`, `librariesOnly`) also work.
# `new_data` is the one to leave set: it is the cheap repeatable run.
qb_scope = new_data

# Which forum boards to walk, comma separated:
#   main      board 8, the main Mods board
#   lesser    board 3, the Modding subforum (works in progress, newer authors)
#   libraries board 9, Modding Resources and Libraries
qb_boards = main,lesser,libraries

# How long to wait between forum requests, in milliseconds. Be kind to the
# forum: don't lower this without a good reason. (Built-in default: 1500.)
qb_delay_ms = 1000

# Per-board page limits, 20 topics to a page. Blank means every page of that
# board. Main and libraries only apply when `qb_scope = pages`; the lesser one
# always applies, whatever the scope, because that board is mostly noise the
# further back you go.
qb_max_pages_main = 15
qb_max_pages_lesser = 20
qb_max_pages_libraries = 3

# Replay saved forum pages instead of fetching them. Same idea as
# `modrepo_use_cached`. Jobs started from the browser always fetch fresh pages
# and ignore this.
qb_use_cached = false

# How many past runs the history keeps. Older ones are dropped along with their
# log files — only the paperwork goes, never the scraped data. 0 keeps the lot.
qb_runs_to_keep = 100

# How many published bundles to keep a snapshot of, so you can see what a run
# changed, and how far back one topic's history goes. About a megabyte each —
# the posts' text is left out, which is what keeps them small. At the default,
# and publishing twice a day, that is roughly 600 MB and about eight months.
# 0 keeps the lot.
qb_bundles_to_keep = 500

# Hand the QB job to a running viewer server instead of doing the work here,
# e.g. http://127.0.0.1:8085 . Blank means this program does the work itself,
# which is what you want in production. If the address can't be reached, or that
# server works on a different folder, you get a plain warning and the job runs
# here anyway — it is never quietly skipped.
qb_manager_url =


# =========================
# Asking an LLM about each post
# =========================
# Optional. Sends each saved post to any OpenAI-compatible chat endpoint to pull
# out facts the rules miss: extra downloads, changelog, version, support links,
# licence. Answers are saved, so a topic is only ever paid for once.
#
# Read this before switching it on. Turning it on means EVERY topic on disk gets
# processed, not just the ones scraped this run — so the first run works through
# the whole backlog (about a thousand topics) and that is a real bill. The cap
# below is set low on purpose: each run picks up where the last one stopped, so
# you can pace it and watch what it costs.

llm_enabled = false

# Where to send the requests, and which model to ask.
#   OpenRouter: https://openrouter.ai/api/v1/chat/completions
#   Ollama:     http://localhost:11434/v1/chat/completions
#   llama.cpp:  http://localhost:8080/v1/chat/completions
# A local server is free and has no rate limit, so it is the better home for a
# long backlog — point this at your own machine if you have one.
llm_base_url = https://openrouter.ai/api/v1/chat/completions

# Model id, as the endpoint names it. Pick a plain instruct model, not a
# reasoning one: this job is straight extraction, and thinking burns the reply
# budget before the answer is written.
llm_model = Qwen/Qwen3-30B-A3B-Instruct-2507

# Bearer token for the endpoint. Cloud providers need one (an OpenRouter key
# from https://openrouter.ai/keys). Local servers need none — leave it blank.
llm_api_token =

# How many live calls one run may make — the setting that decides what you
# spend. Blank means no cap, which is right once you trust the setup and are
# running against a local server. Saved answers are free and don't count.
# (Built-in default: blank.)
llm_max_topics = 100

# How many calls may be going at the same time. The scrape doesn't wait for
# the model any more — it starts a read for each topic and moves straight on
# to the next forum fetch — so this is what keeps a run from hitting the LLM
# service with everything at once. (Built-in default: 3.)
llm_max_concurrent_calls = 3

# How long to wait for one answer, in seconds. A local model writing a long
# answer for a big post can need more than a minute. A timed-out call is not
# retried; that post just falls back to the rules-based result.
llm_timeout_seconds = 120

# Give up on the LLM for the rest of the run after this many failures in a row.
# Any success resets the count. This is the guard against a provider that is
# down or misconfigured quietly eating a whole run.
llm_max_consecutive_failures = 10

# Most posts answer in well under 2000 tokens, but a release post with a long
# changelog copied out in full can need 6000–8000 on its own. 12000 clears the
# worst of them with room to spare, and costs nothing on the posts that don't
# need it. (Built-in default: 4000.)
llm_max_tokens = 12000

# Cap on how many characters of the post body are sent. Blank sends the whole
# post, which is what you want. Set it only if you hit "context size exceeded"
# on a small local model — roughly 4 characters to a token, so 24000 ≈ 6000.
llm_max_input_chars =

# Ask the model not to think. The client sends OpenRouter its reasoning control
# and sends local servers their own controls. Set this true for extraction.
llm_disable_thinking = false

# Make the server hold the model to the exact answer shape as it writes. When
# the endpoint supports it (llama.cpp does), broken JSON becomes impossible —
# and broken JSON is the main reason a post falls back to rules-only. Turn it
# off if your endpoint refuses the request, which shows up as failed calls
# rather than as a fallback. (Built-in default: false.)
llm_structured_output = true

# Also ask for a short summary of each mod: one sentence and one paragraph, in
# the model's own words rather than copied from the post. This is what the mod
# card shows. (Built-in default: false.)
llm_summaries = true

# --- A second endpoint, for when the first one lets us down ---
# Used when a call to the primary fails for any reason — the server isn't there,
# it timed out, it answered with an error, or its answer couldn't be read. The
# first such failure sends that post here and keeps every later post coming here
# for the rest of the run, so a server that is off or broken isn't knocked on
# once per topic. The next run tries the primary again. Both the URL and the
# model must be set for this to be on.
#
# The pairing that works: a local server as the primary above, and a cloud
# endpoint here. The switch below disables reasoning for OpenRouter and for
# local servers. Leave structured output off here too: most cloud providers
# reject it outright.
llm_fallback_base_url =
llm_fallback_model =
llm_fallback_api_token =
llm_fallback_disable_thinking = false
llm_fallback_structured_output = false

# Allow falling over from a free primary to a fallback that charges per token.
# Off by default, so a setup that costs nothing today cannot quietly start
# costing money.
#
# **If your primary is a local or home-network server and your fallback is a
# cloud endpoint, set this to true** — otherwise the fallback above will never
# be used, and the run says so in the log.
#
# It makes no difference when both endpoints cost money, when both are free, or
# when the fallback is the cheaper of the two: those switches are always
# allowed. Free means a loopback, private-network or ".local" address, or a
# model name ending in ":free" (OpenRouter's mark for a model it doesn't charge
# for). Everything else counts as paid.
llm_fallback_free_to_paid = false

# --- Running the LLM on its own ---

# Skip the forum entirely and just fill in answers for topics already saved.
# This is how you reprocess after changing the prompt, without touching the
# forum. Only new or changed posts are paid for.
llm_reprocess_only = false

# Try the prompt on a few saved posts and write `llm-test-output.json`. Nothing
# else is saved, so it is the safe way to see what the prompt produces before
# paying for a full pass.
llm_test_mode = false
llm_test_limit = 5

# Which topics the test should use, comma separated. Blank picks the hard ones
# for you — posts where the rules found no download, or only weak guesses.
llm_test_topic_ids =


# =========================
# Publishing to GitHub
# =========================
# The "Publish to GitHub" button on the web page copies the two output files
# (ModRepo.json and forum-data-bundle.json) into a clone of the repo below and
# pushes them. There is no token here on purpose: it uses the host's own git and
# SSH key, exactly as the twice-a-day cron script does. So the service must run
# as a user whose git can push to this repo.

# Where to publish. (Built-in default: this same URL.)
publish_repo_url = git@github.com:wispborne/StarsectorModRepo.git

# The folder the server keeps its working clone in. Keep it apart from any folder
# a cron job wipes at the start of its run, or a publish could be cut off
# mid-push. Blank means a `publish-clone` folder under `qb_data_path`.
publish_clone_dir =

# Where the public website's own files live — its HTML, stylesheet and scripts.
# They are copied into the clone next to the data they read, so the pushed repo
# can be served as the website with nothing further to do. The default is the
# `site` folder in this repo; set it when the service runs from somewhere else.
publish_site_path = site
