<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Mod Repo Viewer</title>
  <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="takedowns.css">
</head>
<body>
  <!-- Use a button because the URL hash selects the page. A "#content" link would change it. -->
  <button type="button" id="skip-link" class="skip-link">Skip to content</button>
  <div class="frame">
    <aside id="rail" class="rail"></aside>
    <div class="work">
      <header id="toolbar" class="toolbar"></header>
      <main id="content" class="content" tabindex="-1"></main>
    </div>
    <footer id="statusbar" class="statusbar"></footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
